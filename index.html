<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rival AI Mentor — Advanced Chatbot</title>
  <style>
    :root {
      --accent: #ff6c37;
      --accent-2: #ff8a5c;
      --danger: #ff5c5c;
      --ok: #3ddc84;
    }
    [data-theme="dark"] {
      --bg: #0f1117; --panel: #171a23; --panel-2: #1f2330; --panel-3: #262b3a;
      --text: #e8eaed; --muted: #9aa0ad; --border: #2a2f3d;
      --user-bubble: #ff6c37; --bot-bubble: #272c3a; --code-bg: #0b0d13;
    }
    [data-theme="light"] {
      --bg: #f4f5f7; --panel: #ffffff; --panel-2: #f0f1f4; --panel-3: #e6e8ec;
      --text: #1b1f27; --muted: #6b7280; --border: #d9dce2;
      --user-bubble: #ff6c37; --bot-bubble: #eceef2; --code-bg: #f0f1f4;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; height: 100vh; overflow: hidden;
      transition: background .25s, color .25s;
    }

    /* ---------- Sidebar ---------- */
    .sidebar {
      width: 260px; background: var(--panel-2); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; flex-shrink: 0; transition: margin-left .25s;
    }
    .sidebar-head { padding: 14px; border-bottom: 1px solid var(--border); }
    .new-chat {
      width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 10px;
      padding: 10px; font-weight: 600; cursor: pointer; font-size: 14px;
    }
    .new-chat:hover { background: var(--accent-2); }
    .sessions { flex: 1; overflow-y: auto; padding: 8px; }
    .session {
      display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 8px;
      cursor: pointer; font-size: 13px; color: var(--muted); margin-bottom: 2px;
    }
    .session:hover { background: var(--panel-3); color: var(--text); }
    .session.active { background: var(--panel-3); color: var(--text); }
    .session .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .session .del { opacity: 0; border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 14px; }
    .session:hover .del { opacity: 1; }
    .session .del:hover { color: var(--danger); }
    .sidebar-foot { padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
    .sidebar-foot button {
      flex: 1; background: var(--panel-3); border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 8px; cursor: pointer; font-size: 12px;
    }
    .sidebar-foot button:hover { border-color: var(--accent); }

    /* ---------- Main ---------- */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    header {
      padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
    }
    .burger { display: none; background: transparent; border: none; color: var(--text); font-size: 20px; cursor: pointer; }
    .avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    header h1 { font-size: 15px; margin: 0; }
    header p { font-size: 12px; margin: 1px 0 0; color: var(--muted); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; margin-right: 5px; }
    .status-dot.ok { background: var(--ok); }
    .status-dot.err { background: var(--danger); }
    .head-actions { margin-left: auto; display: flex; gap: 8px; }
    .icon-btn {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      border-radius: 8px; padding: 7px 10px; cursor: pointer; font-size: 13px;
    }
    .icon-btn:hover { color: var(--text); border-color: var(--accent); }

    .settings {
      padding: 14px 18px; background: var(--panel); border-bottom: 1px solid var(--border);
      display: none; flex-direction: column; gap: 10px;
    }
    .settings.open { display: flex; }
    .settings .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .settings .field { flex: 1; min-width: 180px; }
    .settings label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
    .settings input {
      width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 10px; color: var(--text); font-size: 13px;
    }
    .settings input:focus { outline: none; border-color: var(--accent); }

    .messages { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
    .empty-state { margin: auto; text-align: center; color: var(--muted); max-width: 440px; }
    .empty-state h2 { color: var(--text); margin-bottom: 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
    .chip {
      background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
      border-radius: 20px; padding: 8px 14px; font-size: 13px; cursor: pointer;
    }
    .chip:hover { border-color: var(--accent); }

    .msg { display: flex; gap: 10px; max-width: 85%; animation: fade .2s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg .tag {
      width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; flex-shrink: 0;
    }
    .msg.user .tag { background: var(--accent); color: #fff; }
    .msg.bot .tag { background: var(--panel-2); color: var(--accent); border: 1px solid var(--border); }
    .bubble-wrap { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .bubble {
      padding: 11px 14px; border-radius: 14px; font-size: 14px; line-height: 1.55;
      word-wrap: break-word; overflow-wrap: anywhere;
    }
    .msg.user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 4px; }
    .msg.bot .bubble { background: var(--bot-bubble); color: var(--text); border-bottom-left-radius: 4px; }
    .bubble.error { background: rgba(255,92,92,0.12); color: var(--danger); border: 1px solid rgba(255,92,92,0.3); }
    .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
    .bubble pre {
      background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px; overflow-x: auto; font-size: 13px; margin: 8px 0;
    }
    .bubble code { background: var(--code-bg); padding: 2px 5px; border-radius: 4px; font-size: 12.5px; }
    .bubble pre code { background: transparent; padding: 0; }
    .bubble ul, .bubble ol { margin: 6px 0; padding-left: 20px; }
    .msg-actions { display: flex; gap: 6px; opacity: 0; transition: opacity .15s; }
    .msg:hover .msg-actions { opacity: 1; }
    .mini-btn {
      background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 12px; padding: 2px 4px;
    }
    .mini-btn:hover { color: var(--accent); }

    .typing span {
      width: 7px; height: 7px; background: var(--muted); border-radius: 50%; display: inline-block;
      animation: blink 1.3s infinite both; margin-right: 3px;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,80%,100% { opacity: .3; } 40% { opacity: 1; } }

    .composer {
      padding: 14px 16px; border-top: 1px solid var(--border); background: var(--panel);
      display: flex; gap: 10px; align-items: flex-end;
    }
    .composer textarea {
      flex: 1; resize: none; background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); padding: 11px 13px; font-size: 14px;
      font-family: inherit; max-height: 140px; line-height: 1.4;
    }
    .composer textarea:focus { outline: none; border-color: var(--accent); }
    .send, .stop {
      border: none; color: #fff; border-radius: 12px; padding: 0 18px; height: 44px;
      font-weight: 600; cursor: pointer; font-size: 14px; flex-shrink: 0;
    }
    .send { background: var(--accent); }
    .send:disabled { opacity: .5; cursor: not-allowed; }
    .send:hover:not(:disabled) { background: var(--accent-2); }
    .stop { background: var(--danger); display: none; }
    .char-count { font-size: 11px; color: var(--muted); text-align: right; padding: 2px 18px 0; }

    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--panel-3); color: var(--text); border: 1px solid var(--border);
      padding: 10px 16px; border-radius: 10px; font-size: 13px; opacity: 0;
      pointer-events: none; transition: opacity .2s; z-index: 50;
    }
    .toast.show { opacity: 1; }

    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; }

    @media (max-width: 720px) {
      .sidebar { position: fixed; z-index: 30; height: 100%; margin-left: -260px; }
      .sidebar.open { margin-left: 0; }
      .overlay.open { display: block; }
      .burger { display: block; }
      .msg { max-width: 92%; }
    }
  </style>
</head>
<body>
  <div class="overlay" id="overlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <button class="new-chat" id="newChat">＋ New chat</button>
    </div>
    <div class="sessions" id="sessions"></div>
    <div class="sidebar-foot">
      <button id="themeToggle">🌓 Theme</button>
      <button id="clearAll">🗑 Clear all</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <header>
      <button class="burger" id="burger">☰</button>
      <div class="avatar">R</div>
      <div>
        <h1>Rival AI Mentor</h1>
        <p><span class="status-dot" id="statusDot"></span><span id="statusText">Not connected</span></p>
      </div>
      <div class="head-actions">
        <button class="icon-btn" id="pingBtn" title="Test connection">🔌 Test</button>
        <button class="icon-btn" id="settingsBtn">⚙ Settings</button>
      </div>
    </header>

    <div class="settings" id="settings">
      <div class="row">
        <div class="field">
          <label>API Base URL</label>
          <input id="serverUrl" type="text" placeholder="http://localhost:3000" />
        </div>
        <div class="field">
          <label>Endpoint path</label>
          <input id="endpointPath" type="text" value="/api/ai-chat/ai" />
        </div>
        <div class="field" style="max-width:160px;">
          <label>History turns</label>
          <input id="historyLen" type="number" min="0" max="20" value="6" />
        </div>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ask the Rival AI Mentor anything... (Enter to send, Shift+Enter for newline)"></textarea>
      <button class="send" id="send">Send</button>
      <button class="stop" id="stop">■ Stop</button>
    </div>
    <div class="char-count"><span id="charCount">0</span> / 2000</div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    "use strict";

    // ---------------- Config ----------------
    const DEFAULTS = { serverUrl: "http://localhost:3000", endpointPath: "/api/ai-chat/ai", historyLen: 6 };
    const cfg = {
      serverUrl: localStorage.getItem("rival_serverUrl") || DEFAULTS.serverUrl,
      endpointPath: localStorage.getItem("rival_endpointPath") || DEFAULTS.endpointPath,
      historyLen: parseInt(localStorage.getItem("rival_historyLen") || DEFAULTS.historyLen, 10),
      theme: localStorage.getItem("rival_theme") || "dark"
    };
    const MAX_CHARS = 2000;

    // ---------------- State ----------------
    // sessions: [{ id, title, messages:[{role:'user'|'assistant', text}] }]
    let sessions = JSON.parse(localStorage.getItem("rival_sessions") || "[]");
    let activeId = localStorage.getItem("rival_activeId") || null;
    let abortCtrl = null;

    // ---------------- DOM ----------------
    const $ = (id) => document.getElementById(id);
    const messagesEl = $("messages"), inputEl = $("input"), sendBtn = $("send"), stopBtn = $("stop");
    const sessionsEl = $("sessions"), toastEl = $("toast"), charCountEl = $("charCount");
    const statusDot = $("statusDot"), statusText = $("statusText");

    // ---------------- Helpers ----------------
    const save = () => {
      localStorage.setItem("rival_sessions", JSON.stringify(sessions));
      localStorage.setItem("rival_activeId", activeId || "");
    };
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const getActive = () => sessions.find(s => s.id === activeId);
    function toast(msg) {
      toastEl.textContent = msg; toastEl.classList.add("show");
      clearTimeout(toast._t); toast._t = setTimeout(() => toastEl.classList.remove("show"), 2200);
    }
    function setStatus(state, text) {
      statusDot.className = "status-dot" + (state ? " " + state : "");
      statusText.textContent = text;
    }

    // Minimal + safe markdown (escape first, then format)
    function renderMarkdown(src) {
      let s = src.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      s = s.replace(/```([\s\S]*?)```/g, (_, c) => `<pre><code>${c.replace(/^\n/, "")}</code></pre>`);
      s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      s = s.replace(/^\s*[-*] (.+)$/gm, "<li>$1</li>");
      s = s.replace(/(<li>[\s\S]*?<\/li>)/g, (m) => `<ul>${m}</ul>`);
      s = s.split(/\n{2,}/).map(b => /^<(ul|pre|h\d)/.test(b.trim()) ? b : `<p>${b.replace(/\n/g, "<br>")}</p>`).join("");
      return s;
    }

    // ---------------- Sessions ----------------
    function newSession(makeActive = true) {
      const s = { id: uid(), title: "New chat", messages: [] };
      sessions.unshift(s);
      if (makeActive) activeId = s.id;
      save(); renderSessions(); renderMessages();
    }
    function deleteSession(id) {
      sessions = sessions.filter(s => s.id !== id);
      if (activeId === id) activeId = sessions[0] ? sessions[0].id : null;
      if (!activeId) newSession(); else { save(); renderSessions(); renderMessages(); }
    }
    function renderSessions() {
      sessionsEl.innerHTML = "";
      sessions.forEach(s => {
        const el = document.createElement("div");
        el.className = "session" + (s.id === activeId ? " active" : "");
        el.innerHTML = `<span>💬</span><span class="title"></span><button class="del" title="Delete">✕</button>`;
        el.querySelector(".title").textContent = s.title;
        el.addEventListener("click", (e) => {
          if (e.target.classList.contains("del")) return;
          activeId = s.id; save(); renderSessions(); renderMessages(); closeSidebar();
        });
        el.querySelector(".del").addEventListener("click", (e) => { e.stopPropagation(); deleteSession(s.id); });
        sessionsEl.appendChild(el);
      });
    }

    // ---------------- Messages ----------------
    function renderMessages() {
      messagesEl.innerHTML = "";
      const s = getActive();
      if (!s || s.messages.length === 0) {
        const es = document.createElement("div");
        es.className = "empty-state";
        es.innerHTML = `
          <div class="avatar" style="margin:0 auto 14px;width:52px;height:52px;font-size:22px;">R</div>
          <h2>Rival AI Mentor</h2>
          <p>Namaste! 👋 Hackathon Rivals ke baare mein kuch bhi poochho.</p>
          <div class="chips" id="chips"></div>`;
        messagesEl.appendChild(es);
        const suggestions = [
          "Season 2026 ke themes kya hain?",
          "Registration kaise karein?",
          "Prizes kya hain?",
          "Team size kitni honi chahiye?"
        ];
        const chips = es.querySelector("#chips");
        suggestions.forEach(t => {
          const c = document.createElement("button");
          c.className = "chip"; c.textContent = t;
          c.addEventListener("click", () => { inputEl.value = t; updateCharCount(); send(); });
          chips.appendChild(c);
        });
        return;
      }
      s.messages.forEach((m, i) => addBubble(m.role, m.text, { persist: false, index: i }));
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addBubble(role, text, { isError = false, index = null } = {}) {
      const wrap = document.createElement("div");
      wrap.className = "msg " + (role === "user" ? "user" : "bot");
      const tag = document.createElement("div");
      tag.className = "tag"; tag.textContent = role === "user" ? "U" : "R";

      const bWrap = document.createElement("div");
      bWrap.className = "bubble-wrap";
      const bubble = document.createElement("div");
      bubble.className = "bubble" + (isError ? " error" : "");
      if (role === "assistant" && !isError) bubble.innerHTML = renderMarkdown(text);
      else bubble.textContent = text;

      const actions = document.createElement("div");
      actions.className = "msg-actions";
      const copyBtn = document.createElement("button");
      copyBtn.className = "mini-btn"; copyBtn.textContent = "📋 Copy";
      copyBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(text).then(() => toast("Copied!"));
      });
      actions.appendChild(copyBtn);

      if (isError && index !== null) {
        const retryBtn = document.createElement("button");
        retryBtn.className = "mini-btn"; retryBtn.textContent = "🔄 Retry";
        retryBtn.addEventListener("click", () => retryLast());
        actions.appendChild(retryBtn);
      }

      bWrap.appendChild(bubble); bWrap.appendChild(actions);
      wrap.appendChild(tag); wrap.appendChild(bWrap);
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return bubble;
    }

    function addTyping() {
      const wrap = document.createElement("div");
      wrap.className = "msg bot"; wrap.id = "typing";
      wrap.innerHTML = `<div class="tag">R</div><div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>`;
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    const removeTyping = () => { const t = $("typing"); if (t) t.remove(); };

    // ---------------- Networking ----------------
    function apiUrl() { return cfg.serverUrl.replace(/\/$/, "") + cfg.endpointPath; }

    async function send() {
      const text = inputEl.value.trim();
      if (!text) return;
      if (text.length > MAX_CHARS) { toast("Message too long (max 2000 chars)"); return; }

      let s = getActive();
      if (!s) { newSession(); s = getActive(); }

      // first user message becomes the title
      if (s.messages.length === 0) {
        s.title = text.slice(0, 30) + (text.length > 30 ? "…" : "");
        renderSessions();
      }

      // clear empty-state if present
      if (messagesEl.querySelector(".empty-state")) messagesEl.innerHTML = "";

      s.messages.push({ role: "user", text });
      addBubble("user", text);
      inputEl.value = ""; updateCharCount(); autoGrow();
      save();

      sendBtn.disabled = true; stopBtn.style.display = "inline-block";
      addTyping();

      const historyPayload = s.messages
        .slice(0, -1)                 // exclude the just-added message
        .slice(-cfg.historyLen)       // last N turns
        .map(m => ({ role: m.role, text: m.text }));

      abortCtrl = new AbortController();
      try {
        const res = await fetch(apiUrl(), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history: historyPayload }),
          signal: abortCtrl.signal
        });
        removeTyping();

        if (!res.ok) {
          setStatus("err", "HTTP " + res.status);
          addBubble("assistant", `Request failed (HTTP ${res.status}). Check your server URL in Settings and make sure the server is running.`, { isError: true, index: s.messages.length });
          return;
        }

        const data = await res.json();
        const reply = (data && typeof data.reply === "string" && data.reply) ? data.reply : "(No 'reply' field in response)";
        s.messages.push({ role: "assistant", text: reply });
        addBubble("assistant", reply);
        setStatus("ok", "Connected");
        save();
      } catch (err) {
        removeTyping();
        if (err.name === "AbortError") {
          addBubble("assistant", "⏹ Generation stopped.", { isError: true });
        } else {
          setStatus("err", "Offline");
          addBubble("assistant", `Could not reach the API: ${err.message}. Is your server running at ${cfg.serverUrl}?`, { isError: true, index: s.messages.length });
        }
      } finally {
        sendBtn.disabled = false; stopBtn.style.display = "none";
        abortCtrl = null; inputEl.focus();
      }
    }

    function retryLast() {
      const s = getActive();
      if (!s) return;
      // find last user message
      for (let i = s.messages.length - 1; i >= 0; i--) {
        if (s.messages[i].role === "user") {
          const text = s.messages[i].text;
          // drop any trailing assistant/error entries after it
          s.messages = s.messages.slice(0, i);
          save(); renderMessages();
          inputEl.value = text; send();
          return;
        }
      }
    }

    async function ping() {
      setStatus("", "Testing…");
      try {
        const res = await fetch(apiUrl(), {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: "ping", history: [] })
        });
        if (res.ok) { setStatus("ok", "Connected"); toast("✅ Server reachable"); }
        else { setStatus("err", "HTTP " + res.status); toast("⚠ Server responded " + res.status); }
      } catch (e) {
        setStatus("err", "Offline"); toast("❌ Cannot reach server");
      }
    }

    // ---------------- UI wiring ----------------
    function updateCharCount() {
      const n = inputEl.value.length;
      charCountEl.textContent = n;
      charCountEl.style.color = n > MAX_CHARS ? "var(--danger)" : "var(--muted)";
    }
    function autoGrow() {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
    }
    function openSidebar() { $("sidebar").classList.add("open"); $("overlay").classList.add("open"); }
    function closeSidebar() { $("sidebar").classList.remove("open"); $("overlay").classList.remove("open"); }

    function applyTheme() {
      document.documentElement.setAttribute("data-theme", cfg.theme);
    }

    // Settings inputs
    $("serverUrl").value = cfg.serverUrl;
    $("endpointPath").value = cfg.endpointPath;
    $("historyLen").value = cfg.historyLen;

    $("serverUrl").addEventListener("change", e => { cfg.serverUrl = e.target.value.trim(); localStorage.setItem("rival_serverUrl", cfg.serverUrl); });
    $("endpointPath").addEventListener("change", e => { cfg.endpointPath = e.target.value.trim(); localStorage.setItem("rival_endpointPath", cfg.endpointPath); });
    $("historyLen").addEventListener("change", e => { cfg.historyLen = Math.max(0, Math.min(20, parseInt(e.target.value || "6", 10))); localStorage.setItem("rival_historyLen", cfg.historyLen); e.target.value = cfg.historyLen; });

    $("settingsBtn").addEventListener("click", () => $("settings").classList.toggle("open"));
    $("pingBtn").addEventListener("click", ping);
    $("newChat").addEventListener("click", () => { newSession(); closeSidebar(); inputEl.focus(); });
    $("burger").addEventListener("click", openSidebar);
    $("overlay").addEventListener("click", closeSidebar);
    $("themeToggle").addEventListener("click", () => {
      cfg.theme = cfg.theme === "dark" ? "light" : "dark";
      localStorage.setItem("rival_theme", cfg.theme); applyTheme();
    });
    $("clearAll").addEventListener("click", () => {
      if (confirm("Delete ALL chat sessions? This cannot be undone.")) {
        sessions = []; activeId = null; newSession(); toast("All chats cleared");
      }
    });

    sendBtn.addEventListener("click", send);
    stopBtn.addEventListener("click", () => { if (abortCtrl) abortCtrl.abort(); });
    inputEl.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });
    inputEl.addEventListener("input", () => { updateCharCount(); autoGrow(); });

    // ---------------- Init ----------------
    applyTheme();
    if (sessions.length === 0) newSession();
    else if (!getActive()) activeId = sessions[0].id;
    renderSessions();
    renderMessages();
    inputEl.focus();
  </script>
</body>
</html>
